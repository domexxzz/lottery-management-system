name: CI

on:
  push:
    branches: [main]
  pull_request:

# ยกเลิก run เก่าของ branch เดียวกันเมื่อมี push ใหม่ ไม่ต้องรอ run ที่ล้าสมัย
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lottery
          POSTGRES_PASSWORD: lottery_ci_only
          POSTGRES_DB: lottery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottery -d lottery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lottery:lottery_ci_only@localhost:5432/lottery_test?schema=public
      # ค่าเหล่านี้ใช้เฉพาะใน CI ไม่ใช่ความลับจริง
      SESSION_TTL_MINUTES: "480"
      SESSION_COOKIE_NAME: lottery_session
      SEED_PASSWORD: ciPassword123

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # รัน migration จริงบน Postgres เปล่า เพื่อจับ migration ที่พังตั้งแต่ CI
      - name: Apply migrations
        run: npx prisma migrate deploy

      # ตรวจเส้นทางเงินและด่านกำกับกับฐานข้อมูลจริง
      # ชุดนี้คือสิ่งที่จับได้เมื่อมีคนแก้ settlement หรือ scope แล้วพัง
      - name: Integration tests
        run: npm run test:integration

      - name: Seed smoke test
        run: npx prisma db seed

      - name: Build
        run: npx next build
